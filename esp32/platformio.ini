; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; pio run and the device commands build the tap's firmware; the native
; environment is only for unit tests (pio test -e native).
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
extra_scripts = pre:scripts/device_config.py

lib_deps =
    bblanchon/ArduinoJson@^7
    ESP32Async/ESPAsyncWebServer
    h2zero/NimBLE-Arduino@^2.5.2

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_filters =
    esp32_exception_decoder

; The laptop, for unit tests of code without Arduino dependencies, such as the
; RAPT laser decoder in lib/RaptLaser.
[env:native]
platform = native
test_framework = unity
